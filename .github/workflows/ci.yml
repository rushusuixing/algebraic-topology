name: Algebraic UCT CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v6
      - name: Build with the pinned Lean and Mathlib versions
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
          use-github-cache: false
          lake-package-directory: algebraic-universal-coefficient-theorem
      - name: Check the UCT declarations and transitive axioms
        working-directory: algebraic-universal-coefficient-theorem
        run: python3 scripts/check_axioms.py
